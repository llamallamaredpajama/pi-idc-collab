# tracker-config.yaml — IDC tracker contract (lives at docs/workflow/tracker-config.yaml).
#
# Selects the GitHub tracker backend and pins the project number and the eight
# canonical field node IDs.
#
#   backend: github     -> GitHub Projects v2 board. Hard requirements: `backend`,
#                          `project_number`, and `field_ids` with all eight names below.
#
# Field node IDs are project-specific. After `gh project create`, capture them with a
# GraphQL query over the project's fields and paste the node IDs below. Values are read
# by NAME at runtime ("Active" / "Unclaimed"), so only the eight field node IDs are
# persisted here — single-select option IDs are NOT stored.
#
# Template tokens are quoted to keep this file valid YAML; `/idc:init` substitutes them.

backend: github                                  # github (only recognized v1 value)
project_number: 5     # integer; from `gh project create`

field_ids:
  Status: "PVTSSF_lAHODIGTIM4Badv-zhVVMFE"              # PVTSSF_… single-select
  ClaimState: "PVTSSF_lAHODIGTIM4Badv-zhVVMJ0"          # PVTSSF_… single-select
  Wave: "PVTSSF_lAHODIGTIM4Badv-zhVVMJ4"                # PVTSSF_… single-select
  Phase: "PVTSSF_lAHODIGTIM4Badv-zhVVMJ8"               # PVTSSF_… single-select
  Track: "PVTSSF_lAHODIGTIM4Badv-zhVVMKA"               # PVTSSF_… single-select
  Lane: "PVTSSF_lAHODIGTIM4Badv-zhVVMKE"                # PVTSSF_… single-select
  "Pillar trace key": "PVTF_lAHODIGTIM4Badv-zhVVMLA"    # PVTF_…   text field
  Domain: "PVTSSF_lAHODIGTIM4Badv-zhVVMKI"              # PVTSSF_… single-select

# Optional metadata (loader defaults these when absent).
label_namespace: "idc"
track_values: []
